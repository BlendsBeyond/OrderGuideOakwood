<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Blends & Beyond Supplier Ordering</title>
<style>
:root{--green:#083f31;--green2:#0d5b46;--cream:#f7f3eb;--gold:#e9d79e;--ink:#15392f;--muted:#6c756f;--line:#e4ded3;--whatsapp:#20c968;}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--cream);color:#1d2c27;padding-bottom:110px}
.hero{background:linear-gradient(135deg,var(--green),#062b22);color:white;padding:22px 18px 24px;position:sticky;top:0;z-index:20;box-shadow:0 4px 16px #0002}
.hero-inner{max-width:1100px;margin:auto;display:flex;align-items:center;gap:16px} .logo{width:76px;height:76px;object-fit:cover;border-radius:50%;border:2px solid #f6e8b6;background:#fff}
.hero h1{font-size:clamp(22px,4vw,34px);margin:0 0 4px} .hero p{margin:0;opacity:.86;font-size:14px}
.wrap{max-width:1100px;margin:auto;padding:18px} .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
input,select,textarea{width:100%;border:1px solid #d7d1c7;border-radius:13px;padding:14px;font-size:16px;background:white;color:#1c2c27;outline:none} input:focus,select:focus,textarea:focus{border-color:#497e6d;box-shadow:0 0 0 3px #497e6d22}
.search{grid-column:1/-1} .supplier-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px;scrollbar-width:none} .supplier-tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid #d9d2c7;background:white;color:var(--ink);padding:10px 13px;border-radius:999px;font-weight:700;cursor:pointer} .tab.active{background:var(--green);color:white;border-color:var(--green)}
.supplier{display:none} .supplier.active{display:block} .supplier-head{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin:10px 0 12px;box-shadow:0 2px 10px #00000008}
.supplier-title{font-size:25px;font-weight:800;color:var(--green);margin:0 0 6px} .schedule{display:inline-block;background:#fff4d2;color:#6e5412;border-radius:10px;padding:7px 10px;font-weight:700;font-size:14px}
.count{float:right;color:var(--muted);font-size:13px;font-weight:600;margin-top:5px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px} .product{background:white;border:1px solid var(--line);border-radius:15px;padding:13px;display:flex;align-items:center;gap:12px;min-height:82px}
.product-info{flex:1;min-width:0} .product-name{font-weight:700;line-height:1.25} .meta{font-size:12px;color:#8a908d;margin-top:5px} .qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:36px;height:36px;border-radius:10px;border:1px solid #d9d4cc;background:#f8f7f4;font-size:22px;cursor:pointer;color:var(--green)} .qty input{width:50px;padding:8px 4px;text-align:center;border-radius:10px;font-weight:700}
.notes{margin-top:16px} .bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 20px #0001}
.bottom-inner{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px} .summary{flex:1} .summary strong{font-size:18px;color:var(--green)} .summary small{display:block;color:var(--muted)}
.send{border:0;border-radius:14px;background:var(--whatsapp);color:white;padding:15px 18px;font-size:16px;font-weight:800;cursor:pointer} .clear{border:1px solid #d6d0c7;border-radius:14px;background:white;padding:15px 14px;font-size:15px;font-weight:700;color:#584636;cursor:pointer}
.empty{padding:26px;text-align:center;color:#777;background:white;border-radius:14px}
@media(max-width:650px){.controls{grid-template-columns:1fr} .search{grid-column:auto} .products{grid-template-columns:1fr} .hero{position:relative} .bottom-inner{gap:8px} .send{padding:14px 12px;font-size:14px} .clear{padding:14px 10px}}
</style>
</head>

let active=0;
const tabs=document.getElementById('tabs'), holder=document.getElementById('suppliers'), search=document.getElementById('search');
const key=(s,i)=>`bb_supplier_qty_${s}_${i}`;
function productLabel(p){return typeof p==='string'?p:p.name}
function render(){
 tabs.innerHTML=''; holder.innerHTML='';
 SUPPLIERS.forEach((s,si)=>{
  const t=document.createElement('button'); t.className='tab'+(si===active?' active':''); t.textContent=s.name; t.onclick=()=>{active=si;search.value='';render();}; tabs.appendChild(t);
  const sec=document.createElement('section'); sec.className='supplier'+(si===active?' active':'');
  const head=document.createElement('div'); head.className='supplier-head'; head.innerHTML=`<span class="count">${s.products.length} products</span><h2 class="supplier-title">${s.name}</h2><span class="schedule">${s.schedule}</span>`; sec.appendChild(head);
  const grid=document.createElement('div'); grid.className='products';
  const q=search.value.trim().toLowerCase(); let shown=0;
  s.products.forEach((p,pi)=>{ const label=productLabel(p); if(q && !label.toLowerCase().includes(q) && !(p.code||'').toLowerCase().includes(q)) return; shown++;
    const row=document.createElement('div'); row.className='product';
    const meta=typeof p==='object' ? [p.code?`Code ${p.code}`:'',p.pack?`Pack ${p.pack}`:''].filter(Boolean).join(' • ') : '';
    row.innerHTML=`<div class="product-info"><div class="product-name">${label}</div>${meta?`<div class="meta">${meta}</div>`:''}</div><div class="qty"><button type="button" class="minus">−</button><input inputmode="numeric" pattern="[0-9]*" min="0" value="${localStorage.getItem(key(si,pi))||0}"><button type="button" class="plus">+</button></div>`;
    const inp=row.querySelector('input'); const save=()=>{let v=Math.max(0,parseInt(inp.value)||0);inp.value=v;localStorage.setItem(key(si,pi),v);updateSummary();};
    row.querySelector('.minus').onclick=()=>{inp.value=Math.max(0,(parseInt(inp.value)||0)-1);save();}; row.querySelector('.plus').onclick=()=>{inp.value=(parseInt(inp.value)||0)+1;save();}; inp.oninput=save; grid.appendChild(row);
  });
  if(!shown) grid.innerHTML='<div class="empty">No products match your search.</div>';
  sec.appendChild(grid); holder.appendChild(sec);

function selectedFor(si){const s=SUPPLIERS[si],arr=[];s.products.forEach((p,pi)=>{const q=parseInt(localStorage.getItem(key(si,pi))||0);if(q>0)arr.push({name:productLabel(p),qty:q})});return arr}

search.addEventListener('input',render);
document.getElementById('clearBtn').onclick=()=>{SUPPLIERS[active].products.forEach((_,pi)=>localStorage.removeItem(key(active,pi)));render();};

*Supplier:* ${s.name}
*Branch:* ${branch}`;

*Staff:* ${staff}`; text+=`
*Ordering rule:* ${s.schedule}

*ORDER:*
`;

`); if(notes) text+=`
*Notes:* ${notes}`; text+=`

};
